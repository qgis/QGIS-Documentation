name: Update English PO files for translation

on:
  push:
    branches:
      - release_3.44
    paths:
      - 'docs/**'
      - 'themes/**/*.html'

  workflow_dispatch:

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  prepare_translation:

    permissions:
      contents: write  # for stefanzweifel/git-auto-commit-action to push code in repo
    if: github.repository_owner == 'qgis'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo-and-containers: true
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            qgis.org:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release_3.44

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r REQUIREMENTS.txt

      - name: Generate English PO files
        id: "generate-po-files"
        run: |
          make gettext
          sphinx-intl update -p build/gettext -l en
          # Remove obsolete strings from the generated *.po files
          find locale/en/LC_MESSAGES/ -type f -name '*.po' -exec sed -i '/^#~ /,/^$/d' {} \;

      - name: Commit the changes in the PO files
        id: "auto-commit-action"
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Update English PO files

      - name: "Inform that changes have been made"
        if: steps.auto-commit-action.outputs.changes_detected == 'true'
        run: echo "Changes committed!"

      - name: "Inform that no changes were performed"
        if: steps.auto-commit-action.outputs.changes_detected == 'false'
        run: echo "No Changes detected!"
